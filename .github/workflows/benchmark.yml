name: Benchmark

on:
  push:
  workflow_dispatch:
    inputs:
      bench_all: 
        description: 'Benchmark all packages'
        required: false
        default: 'false'
        type: boolean

env:
  AOC_HOME: ${{ github.workspace }}

jobs:

  Build-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        shell: bash
        run: go build -o ./cmd/benchmark/benchmark ./cmd/benchmark

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: ./cmd/benchmark/benchmark
          retention-days: 1

  Test-and-benchmark:
    runs-on: ubuntu-latest
    outputs:
      benchmarked: ${{ steps.benchmark.outputs.benchmarked }}
    steps:
      - uses: actions/checkout@v5

      - name: Run Common Setup
        uses: ./.github/actions/common-setup
        with:
          git_crypt_key: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Test
        run: go test -v ./...

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        
      - name: List changed files
        id: list_changed_files
        run: |
          if [ "${{ github.event.inputs.bench_all }}" = "true" ]; then
            echo "Benchmarking all packages"
            echo "packages_to_test=./..." >> $GITHUB_OUTPUT
            exit 0
          fi
          PACKAGES_TO_TEST=""
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == internal/years/*/*.go ]]; then
              PACKAGES_TO_TEST+=" ./$(dirname $file)/"
            fi
          done
          echo "Packages to test: $PACKAGES_TO_TEST"
          echo "packages_to_test=$PACKAGES_TO_TEST" >> $GITHUB_OUTPUT

      - name: Benchmark
        id: benchmark
        env:
          PACKAGES_TO_TEST: ${{ steps.list_changed_files.outputs.packages_to_test }}
        run: |
          mkdir -p /tmp/aoc
          if [ -z "$PACKAGES_TO_TEST" ]; then
            echo "No packages to benchmark"
            echo "benchmarked=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Running benchmarks for packages: $PACKAGES_TO_TEST"
          go test -bench . -v -skip Test -count 3 -cpu 1 $PACKAGES_TO_TEST > /tmp/aoc/benchmark-results.txt
          echo "benchmarked=true" >> $GITHUB_OUTPUT

      - name: Upload benchmark results
        if: steps.benchmark.outputs.benchmarked == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/aoc/benchmark-results.txt
          retention-days: 1

  Generate-and-publish:
    needs: [Build-generator, Test-and-benchmark]
    if: needs.Test-and-benchmark.outputs.benchmarked == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: benchmark
          path: ./cmd/benchmark

      - name: Download benchmark results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results
          path: /tmp/aoc

      - name: Carry over previous site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "BRANCH=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          mkdir -p site prev
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=20" \
            -q '[.artifacts[] | select(.expired == false)][0].workflow_run.id')
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n github-pages -D prev
            tar -xf prev/artifact.tar -C site
          fi

      - name: Restore benchmark history for this branch
        run: |
          if [ -f "site/branches/$BRANCH/benchmark.json" ]; then
            cp "site/branches/$BRANCH/benchmark.json" benchmark.json
          fi

      - name: Benchmark
        run: |
          chmod +x ./cmd/rbenchmark/benchmark
          ./cmd/benchmark/benchmark

      - name: Add to site
        run: |
          d=site/branches/$BRANCH
          mkdir -p $d
          cp benchmark.md benchmark.json /tmp/aoc/benchmark-results.txt $d/
          cp .github/pages/index.html $d/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 90

      - id: deploy
        uses: actions/deploy-pages@v4